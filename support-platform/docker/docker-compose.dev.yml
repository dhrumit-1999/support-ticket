version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: support_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: support_platform
      MYSQL_USER: support_user
      MYSQL_PASSWORD: support_pass123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    networks:
      - support_network

  # PHP Application (Laravel)
  php:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: support_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
      - ../public:/var/www/public
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: support_platform
      DB_USERNAME: support_user
      DB_PASSWORD: support_pass123
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    networks:
      - support_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: support_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../public:/var/www/public
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - support_network

  # phpMyAdmin (Optional - for development)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: support_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword123
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - support_network

volumes:
  mysql_data:
    driver: local

networks:
  support_network:
    driver: bridge
